name: "Deploy Android"

on:
  workflow_run:
    workflows: [ "Prepare Release" ]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Extract Version from Gradle
        id: extract_version
        run: |
          BUILD_FILE="androidApp/build.gradle.kts"
          VERSION_NAME=$(grep -E 'versionName\s*=' "$BUILD_FILE" | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' "$BUILD_FILE" | sed -E 's/.*versionCode\s*=\s*([0-9]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: "Setup Java"
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v6

      - name: "Create google-services.json"
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > androidApp/google-services.json

      - name: "Decode Keystore"
        run: |
          python3 -c "
          import base64
          key = '${{ secrets.MIXDRINKS_ANDROID_SIGNING_KEY }}'.strip()
          key += '=' * (-len(key) % 4)
          with open('androidApp/release.jks', 'wb') as f:
              f.write(base64.b64decode(key))
          "

      - name: "Build bundle release"
        run: ./gradlew :androidApp:bundleRelease

      - name: "Sign AAB Release"
        id: sign_app
        run: |
          AAB_FILE="androidApp/build/outputs/bundle/release/androidApp-release.aab"
          KEYSTORE="androidApp/release.jks"
          ALIAS="${{ secrets.MIXDRINKS_ANDROID_ALIAS }}"
          STORE_PASS="${{ secrets.MIXDRINKS_ANDROID_KEY_STORE_PASSWORD }}"
          KEY_PASS="${{ secrets.MIXDRINKS_ANDROID_KEY_PASSWORD }}"

          if [ ! -f "$AAB_FILE" ]; then
            echo "Error: AAB file not found at $AAB_FILE"
            exit 1
          fi

          echo "Signing $AAB_FILE..."
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            "$AAB_FILE" "$ALIAS"

          echo "signedReleaseFile=$AAB_FILE" >> $GITHUB_OUTPUT
          echo "Signed successfully!"

      - uses: actions/upload-artifact@v7
        with:
          name: "Upload AAB file as artifact"
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: "Upload to Google Play"
        env:
          MIXDRINKS_MOBILE_APP_VERSION_NAME: ${{ steps.extract_version.outputs.version_name }}
          MIXDRINKS_MOBILE_APP_VERSION_CODE: ${{ steps.extract_version.outputs.version_code }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.MIXDRINKS_ANDROID_DEPLOY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.lucolimac.afelixpromo
          releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
          track: internal
          status: completed